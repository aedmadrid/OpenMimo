[package]
name = "openmimo"
version = "1.0.0"
description = "OpenMimo — FOSS Academic Timetabling Application (Tauri + React + Go)"
authors = ["OpenMimo Contributors"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[target.'cfg(target_os = "macos")'.build-dependencies]
cc = "1"

[dependencies]
tauri = { version = "2", features = ["custom-protocol"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = "s"
strip = true
