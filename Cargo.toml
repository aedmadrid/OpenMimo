[package]
name = "openmimo"
version = "1.0.0"
description = "OpenMimo — GPLv3 Academic Timetabling Application (Tauri + React + Go)"
license = "GPL-3.0-or-later"
authors = ["OpenMimo Contributors"]
edition = "2021"
build = "build.rs"

[[bin]]
name = "openmimo"
path = "src-tauri/src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[target.'cfg(target_os = "macos")'.build-dependencies]
cc = "1"

[dependencies]
tauri = { version = "2", features = ["custom-protocol"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = "s"
strip = true
