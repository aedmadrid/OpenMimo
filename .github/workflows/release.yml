name: Release OpenMimo (macOS, Windows & Linux AppImage)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest        # Apple Silicon
            goos: darwin
            goarch: arm64
            backend_name: openmimo-backend
            tauri_args: '--bundles dmg'
          - os: macos-15-intel      # Intel
            goos: darwin
            goarch: amd64
            backend_name: openmimo-backend
            tauri_args: '--bundles dmg'
          - os: windows-latest
            goos: windows
            goarch: amd64
            backend_name: openmimo-backend.exe
            tauri_args: '--bundles nsis,msi'
          - os: ubuntu-22.04
            goos: linux
            goarch: amd64
            backend_name: openmimo-backend
            tauri_args: '--bundles appimage'

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux Tauri & AppImage dependencies
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'   # backend/go.mod requires go >= 1.24

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build Go Backend
        shell: bash
        run: |
          cd backend
          GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} CGO_ENABLED=0 \
            go build -ldflags="-s -w" -o ${{ matrix.backend_name }} .

      - name: Install Frontend Dependencies & Build UI
        shell: bash
        run: |
          bun install --frozen-lockfile
          bun run build

      # tauri.conf.json bundles backend/openmimo-backend* as $RESOURCE/backend/,
      # which is where src-tauri/src/main.rs looks for the Go server.
      - name: Build Tauri App & Installers
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: .
          args: ${{ matrix.tauri_args }}
          tagName: v__VERSION__
          releaseName: 'OpenMimo v__VERSION__'
          releaseBody: |
            Instaladores oficiales de OpenMimo (GNU GPLv3).

            ### macOS
            1. Abre el `.dmg` y arrastra **OpenMimo** a *Aplicaciones*.
               Usa el DMG `aarch64` en Apple Silicon y el `x64` en Macs Intel.
            2. La app no está firmada ni notarizada (proyecto FOSS sin certificado de Apple).
               Si macOS dice que está dañada o que no se puede abrir, ejecuta en Terminal:

               ```bash
               xattr -dr com.apple.quarantine /Applications/OpenMimo.app
               ```

               y vuelve a abrirla. También puedes hacer clic derecho → **Abrir** la primera vez.

            ### Windows
            - Si SmartScreen muestra «Windows protegió tu PC», pulsa **Más información → Ejecutar de todas formas**.
            - `.exe` es el instalador NSIS y `.msi` el instalador MSI.

            ### Linux
            ```bash
            chmod +x OpenMimo_*.AppImage
            ./OpenMimo_*.AppImage
            ```

            **Estado experimental:** guarda copias en formato `.omimo` y revisa siempre tus horarios antes de publicarlos. OpenMimo no está afiliado a Mimosa.
          releaseDraft: false
          prerelease: false
